name: Thirteen shop family source contracts
on:
  push:
    branches: [fix/m03-businessdata-contract-20261110]
    paths:
      - 'scripts/family_inventory.py'
      - 'scripts/build_family_staging.py'
      - 'tests/test_family_staging.py'
      - '.github/workflows/family-contract.yml'
  pull_request:
    paths:
      - 'scripts/family_inventory.py'
      - 'scripts/build_family_staging.py'
      - 'tests/test_family_staging.py'
      - '.github/workflows/family-contract.yml'
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install openpyxl
      - name: Compile family importer and inventory
        run: python -m py_compile scripts/family_inventory.py scripts/build_family_staging.py
      - name: Synthetic family-specific preservation tests
        run: PYTHONPATH=.:src python -m unittest discover -s tests -p 'test_family_staging.py' -v
